<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>פרויקטים | גנס אדריכלות נוף</title>
<meta name="description" content="גלריית פרויקטים של גנס אדריכלות נוף: גינות פרטיות בקיבוצים ובמושבים, גן הנצחה קהילתי ותוכניות נוף.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="projects">
<main id="main" tabindex="-1">
  <div class="page-head">
    <div class="wrap">
      <div class="crumbs"><a href="index.html">בית</a> / פרויקטים</div>
      <h1>פרויקטים</h1>
      <p class="lead">מבחר מהגינות והמרחבים שתכננו ובנינו. לחצו על פרויקט לגלריה המלאה.</p>
    </div>
  </div>
  <section style="padding-top:40px">
    <div class="wrap">
      <div class="filters" role="group" aria-label="סינון לפי סוג פרויקט" id="filters"></div>
      <div class="grid" id="grid" aria-live="polite"></div>
    </div>
  </section>
  <section class="band">
    <img src="img/hero-2.webp" alt="" loading="lazy">
    <div class="wrap">
      <h2>הפרויקט הבא יכול להיות שלכם</h2>
      <p>נשמח לשמוע על המקום ולהציע כיוון.</p>
      <a class="btn btn-clay" href="contact.html">לתיאום פגישה</a>
    </div>
  </section>
</main>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/site.js"></script>
<script>
(function () {
  var grid = document.getElementById('grid'), fl = document.getElementById('filters');
  var kinds = ['הכול'].concat(GENS_PROJECTS.map(function (p) { return p.kind; }).filter(function (k, i, a) { return a.indexOf(k) === i; }));
  fl.innerHTML = kinds.map(function (k, i) { return '<button type="button" aria-pressed="' + (i === 0) + '">' + k + '</button>'; }).join('');
  function render(kind) {
    grid.innerHTML = GENS_PROJECTS.filter(function (p) { return kind === 'הכול' || p.kind === kind; }).map(function (p) {
      var c = p.images[0];
      return '<a class="card" href="project.html?p=' + p.slug + '"><div class="card-img"><img src="img/' + p.slug + '/t/' + c[0] + '.webp" alt="גינה בפרויקט ' + p.title + '" loading="lazy"></div>' +
        '<div class="card-body"><h3>' + p.title + '</h3><small>' + p.kind + ' · ' + p.images.length + ' תמונות</small></div></a>';
    }).join('');
  }
  fl.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    fl.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
    render(b.textContent);
  });
  render('הכול');
})();
</script>
</body>
</html>
